experiment_name: feedback_template_c3_main
seed: 13

input:
  subset_path: data/eval_subsets/main_1000.parquet

output:
  run_root: runs

model:
  alias: qwen3_14b
  provider: hf_transformers
  model_name: Qwen/Qwen3-14B
  hf_home: /rit-as-pvc/pablo/hf
  device_map: auto
  torch_dtype: bfloat16
  enable_thinking: false
  temperature: 0.0
  max_tokens: 64

teacher:
  type: template_oracle
  max_feedback_constraints: 3
  seed: 13
  min_delta:
    lab_l: 2.0
    lab_a: 3.0
    lab_b: 3.0
    hsv_s: 0.05

prompt:
  initial_template_path: configs/prompts/feedback_initial.txt
  revision_template_path: configs/prompts/feedback_revision.txt

execution:
  max_turns: 3
  convergence_delta_e: 5.0
  stop_on_parse_failure: false
  limit: null
  batch_size: 1
  sleep_s: 0.0
  resume: true
