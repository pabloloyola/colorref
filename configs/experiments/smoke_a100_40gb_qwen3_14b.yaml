experiment_name: smoke_a100_40gb_qwen3_14b
seed: 13

input:
  subset_path: data/eval_subsets/debug_400.parquet

output:
  run_root: runs

model:
  alias: qwen3_14b_a100_smoke
  provider: hf_transformers
  model_name: Qwen/Qwen3-14B
  # Use HF_HOME from the environment or the standard Hugging Face cache.
  hf_home: null
  device_map: auto
  torch_dtype: bfloat16
  enable_thinking: false
  temperature: 0.0
  max_tokens: 64

teacher:
  type: axis_oracle
  max_feedback_constraints: 3
  min_delta:
    lab_l: 2.0
    lab_a: 3.0
    lab_b: 3.0
    hsv_s: 0.05

prompt:
  initial_template_path: configs/prompts/feedback_initial.txt
  revision_template_path: configs/prompts/feedback_revision.txt

execution:
  # Four examples and one revision round validate the full pipeline cheaply.
  limit: 4
  max_turns: 1
  convergence_delta_e: 5.0
  stop_on_parse_failure: false
  batch_size: 1
  sleep_s: 0.0
  resume: true
