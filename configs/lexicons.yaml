# Lexicons for color-name compositional parsing.
# Extend these lists as needed — the parser reads them at runtime.

# Perceptual / intensity modifiers: words that shift a base color
# but are not themselves color names.
modifiers:
  # lightness
  - dark
  - light
  - pale
  - bright
  - deep
  - vivid
  - soft
  - muted
  - dusty
  - faded
  - washed
  - dim
  - bold
  - bleached
  - pastel
  - smoky
  - dull
  - intense
  - rich
  - saturated
  # temperature
  - warm
  - cool
  - hot
  - cold
  - icy
  # chroma / neon
  - neon
  - electric
  - fluorescent
  # texture / finish
  - metallic
  - shiny
  - matte
  - glossy
  - iridescent
  - pearlescent
  # freshness / age
  - fresh
  - old
  - aged
  - vintage
  - dirty
  - muddy
  - murky
  - burnt
  - rusty
  - earthy
  # degree adverbs
  - very
  - slightly
  - almost
  - barely
  - extra
  - ultra
  - super
  - semi
  - nearly
  - not
  - pretty
  # common color adjectives that act as modifiers
  - royal
  - baby
  - midnight
  - sky          # when not the last word
  - forest
  - ocean
  - sea
  - blood
  - lime         # when not last word
  - rose         # when not last word
  - grape
  - neon
  - spring
  - summer
  - winter
  - autumn
  - sunny
  - stormy

